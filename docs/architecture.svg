<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1030" viewBox="0 0 1800 1030" role="img" aria-labelledby="title description">
  <title id="title">Moneypal system architecture</title>
  <desc id="description">Browser traffic enters nginx, which serves Next.js and forwards API requests to FastAPI. FastAPI runs feature APIs and Workbench. Workbench uses in-process tools and a separate governed PostgreSQL MCP service. External dependencies are PostgreSQL, Qdrant, a model endpoint, Exa, and public macro sources. A scheduled macro worker and manual document ingestion populate Qdrant.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5 L1 9 Z" fill="#58728b"/>
    </marker>
    <marker id="teal-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5 L1 9 Z" fill="#0d9488"/>
    </marker>
    <style>
      text { font-family: DejaVu Sans, Arial, sans-serif; fill: #17324d; }
      .heading { font-size: 34px; font-weight: 700; fill: #fff; }
      .subtitle { font-size: 17px; fill: #bed0dc; }
      .section { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; fill: #678097; }
      .name { font-size: 20px; font-weight: 700; }
      .detail { font-size: 14px; fill: #60758a; }
      .small { font-size: 13px; fill: #60758a; }
      .edge { fill: none; stroke: #58728b; stroke-width: 2.6; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-teal { fill: none; stroke: #0d9488; stroke-width: 2.8; stroke-linejoin: round; marker-end: url(#teal-arrow); }
      .edge-dashed { fill: none; stroke: #0d9488; stroke-width: 2.6; stroke-dasharray: 9 6; stroke-linejoin: round; marker-end: url(#teal-arrow); }
      .node { fill: #fff; stroke: #bdcede; stroke-width: 2; }
      .node-blue { fill: #f1f7ff; stroke: #94b8da; stroke-width: 2; }
      .node-teal { fill: #eafaf7; stroke: #74c6ba; stroke-width: 2; }
      .node-external { fill: #fff; stroke: #cbd8e3; stroke-width: 2; }
    </style>
  </defs>

