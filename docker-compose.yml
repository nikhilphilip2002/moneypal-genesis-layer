# Full stack behind nginx on http://localhost:46100 — set GROQ_API_KEY (and
# QDRANT_URL for the shared instance at 192.168.1.183:6333) in .env first.
#
#   nginx :8070  ->  /api/* -> backend :8000 (prefix stripped)
#                    /*     -> frontend :3000
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # Override any host paths from .env with in-container paths.
      # Workbench reaches PostgreSQL through the governed MCP boundary by default.
      POSTGRES_ACCESS_MODE: mcp
      POSTGRES_MCP_URL: http://postgres-mcp:8001/mcp
      LOG_DIR: /srv/backend/data/logs
      REGULATIONS_DIR: /srv/Regulations
      REGISTRY_DIR: /srv/backend/registry/regulations
      LOCAL_INDEX_PATH: /srv/backend/vector_store/regulatory_chunks.jsonl
    volumes:
      - ./Regulations:/srv/Regulations:ro
      - ./backend/data/logs:/srv/backend/data/logs
    depends_on:
      - postgres-mcp

  postgres-mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # The MCP server is the boundary. Its implementation uses the existing hardened
      # direct adapter and must never recursively call itself.
      POSTGRES_ACCESS_MODE: direct
      # Do not download/load the 2GB-class embedding stack in the middle of an MCP call.
      # The governed catalog's curated lexical synonyms remain available for SQL fallback.
      NLQ_CATALOG_VECTORS: "false"
      LOG_DIR: /srv/backend/data/logs
      REGULATIONS_DIR: /srv/Regulations
      REGISTRY_DIR: /srv/backend/registry/regulations
      LOCAL_INDEX_PATH: /srv/backend/vector_store/regulatory_chunks.jsonl
    command: ["python", "-m", "app.mcp.postgres_server"]
    volumes:
      - ./Regulations:/srv/Regulations:ro
      - ./backend/data/logs:/srv/backend/data/logs

  # Weekly macro refresh (Sunday 10:00 IST by default — MACRO_SCHEDULE_* in .env).
  # Long-lived so bge-m3 stays resident and the scheduled run pays no cold start.
  # Qdrant credentials come from .env; it writes to MACRO_COLLECTION and purges any
  # point not stamped with the current run id.
  macro-pipeline:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      LOG_DIR: /srv/backend/data/logs
      REGULATIONS_DIR: /srv/Regulations
      REGISTRY_DIR: /srv/backend/registry/regulations
      MACRO_DATA_DIR: /srv/backend/data/macro
      MACRO_STATE_FILE: /srv/backend/data/macro/state.json
      # Not an API process — keep the catalog embedding stack out of this container.
      NLQ_CATALOG_VECTORS: "false"
    command: ["python", "-m", "scripts.macro_pipeline.run", "schedule"]
    restart: unless-stopped
    volumes:
      # Downloads and the fingerprint manifest must survive restarts, or every
      # restart re-downloads and re-embeds everything.
      - macro-data:/srv/backend/data/macro
      - ./Regulations:/srv/Regulations:ro
      - ./backend/data/logs:/srv/backend/data/logs

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin API calls: the browser hits nginx at /api/*.
        NEXT_PUBLIC_API_URL: /api

  nginx:
    image: nginx:alpine
    ports:
      - "48106:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  macro-data:
