# Re-resolve service names
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend_upstream 64k;
    server backend:8000 resolve;
}

upstream frontend {
    zone frontend_upstream 64k;
    server frontend:3000 resolve;
}

server {
    listen 80;
    server_name _;

    # LLM-backed endpoints can be slow; don't cut them off at nginx's 60s default.
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;

        # API endpoints such as /workbench/ask stream responses. Forward each
        # chunk immediately instead of waiting for nginx to buffer the body.
        proxy_buffering off;
        proxy_cache off;
    }

    location = /health {
        proxy_pass http://backend/health;
    }

    location / {
        proxy_pass http://frontend;
        # Websocket upgrade (Next.js HMR in dev; harmless in prod).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
