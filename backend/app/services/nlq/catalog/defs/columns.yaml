# Genesis NLQ — curated column catalog.
#
# Not every column: the ~700 columns across silver would drown retrieval. These are the
# ones a business question can plausibly reach, each with the business name and synonyms
# that let a question find it. `pg_description` is empty for both schemas — this file is
# the only place the meaning of `gnlnac_pri_repay_amt` is written down.
#
# `sensitivity: pii` drives masking (§7.4). PII values are never placed in an LLM prompt.

# --- silver.loan_account_master ---------------------------------------------------------

- id: loan.account_number
  table: silver.loan_account_master
  column: gnlnac_acnt_num
  label: Loan account number
  synonyms: [account number, loan number, account id, loan account]
  unit: text
  sensitivity: internal
  description: Account identifier. Unique only together with entity_num.

- id: loan.entity_number
  table: silver.loan_account_master
  column: gnlnac_entity_num
  label: Entity
  synonyms: [entity]
  unit: text
  sensitivity: internal
  description: >
    Legal entity. Takes values 1 (13,469 accounts) and 9 (41). Part of every key — a join
    that omits it merges two entities' accounts that share an account number.

- id: loan.customer_id
  table: silver.loan_account_master
  column: gnlnac_cust_id
  label: Customer ID
  synonyms: [customer id, borrower id, CIF]
  unit: text
  sensitivity: internal

- id: loan.customer_name
  table: silver.loan_account_master
  column: gnlnac_cust_name
  label: Borrower name
  synonyms: [customer name, borrower name, who, client name]
  unit: text
  sensitivity: pii
  description: Denormalised borrower name on the account. Masked unless the role permits.

- id: loan.sanctioned_amount
  table: silver.loan_account_master
  column: gnlnac_sanc_amt
  label: Sanctioned amount
  synonyms: [sanctioned, sanction amount, approved amount, limit]
  unit: inr
  agg: [sum, avg, max, min]
  sensitivity: internal
  description: Amount approved at sanction. The facility limit, not necessarily drawn.

- id: loan.disbursed_amount
  table: silver.loan_account_master
  column: gnlnac_lndisb_amt
  label: Disbursed amount (cumulative)
  synonyms: [disbursement, amount given out, released amount, drawn amount]
  unit: inr
  agg: [sum, avg, max]
  sensitivity: internal
  description: >
    Cumulative principal released on this account to date. A stock, not a flow — it is a
    running total as of the last load and must never be summed across periods. For
    "disbursed in <period>" use the disbursement transaction table.

- id: loan.principal_repaid
  table: silver.loan_account_master
  column: gnlnac_pri_repay_amt
  label: Principal repaid (cumulative)
  synonyms: [principal repaid, principal paid back, repaid principal, recovered principal]
  unit: inr
  agg: [sum]
  sensitivity: internal
  description: Cumulative principal repaid on this account to date. A stock, like disbursed_amount.

- id: loan.interest_repaid
  table: silver.loan_account_master
  column: gnlnac_int_repay_amt
  label: Interest repaid (cumulative)
  synonyms: [interest repaid, interest paid, interest received]
  unit: inr
  agg: [sum]
  sensitivity: internal

- id: loan.interest_rate
  table: silver.loan_account_master
  column: gnlnac_ln_intrate
  label: Interest rate
  synonyms: [interest rate, rate, ROI, pricing, coupon]
  unit: percent
  agg: [avg, max, min]
  sensitivity: internal

- id: loan.penal_rate
  table: silver.loan_account_master
  column: gnlnac_penal_intrate
  label: Penal interest rate
  synonyms: [penal rate, penalty rate, default interest]
  unit: percent
  sensitivity: internal

- id: loan.emi_amount
  table: silver.loan_account_master
  column: gnlnac_epi_amt
  label: EMI amount
  synonyms: [EMI, instalment amount, monthly payment]
  unit: inr
  agg: [sum, avg]
  sensitivity: internal

- id: loan.tenor_instalments
  table: silver.loan_account_master
  column: gnlnac_epi_noi
  label: Tenor (instalments)
  synonyms: [tenor, tenure, number of instalments, loan term, duration]
  unit: count
  agg: [avg, max]
  sensitivity: internal

- id: loan.sanction_date
  table: silver.loan_account_master
  column: gnlnac_sanc_date
  label: Sanction date
  synonyms: [sanction date, approval date, booking date, origination date, when sanctioned]
  unit: date
  sensitivity: internal
  description: Range 2023-11-15 to 2026-06-30. The default time axis for origination questions.

- id: loan.first_disbursement_date
  table: silver.loan_account_master
  column: gnlnac_first_disb_date
  label: First disbursement date
  synonyms: [first disbursement, first drawdown, when disbursed]
  unit: date
  sensitivity: internal

- id: loan.closure_date
  table: silver.loan_account_master
  column: gnlnac_closure_date
  label: Closure date
  synonyms: [closure date, closed on, settled date, when closed]
  unit: date
  sensitivity: internal
  description: NULL for open accounts. 166 of 13,510 accounts are closed.

- id: loan.last_payment_date
  table: silver.loan_account_master
  column: gnlnac_last_pymt_date
  label: Last payment date
  synonyms: [last payment, last paid, most recent payment]
  unit: date
  sensitivity: internal

# --- silver.asset_classification_details ------------------------------------------------

- id: risk.dpd_days
  table: silver.asset_classification_details
  column: ascd_dpd_days
  label: Days past due
  synonyms: [DPD, days past due, days overdue, days late, delinquency days]
  unit: days
  agg: [avg, max]
  sensitivity: internal
  description: Observed range 0 to 75 across the book. No account currently exceeds 90.

- id: risk.principal_outstanding
  table: silver.asset_classification_details
  column: ascd_princ_os
  label: Principal outstanding
  synonyms: [outstanding, POS, principal outstanding, exposure, balance]
  unit: inr
  agg: [sum]
  sensitivity: internal
  description: >
    Principal outstanding at the classification event. Point-in-time — valid only for the
    account's latest event as of a date, never summed across events.

- id: risk.asset_code
  table: silver.asset_classification_details
  column: ascd_asset_code
  label: Asset classification
  synonyms: [asset class, classification, NPA status, SMA status]
  unit: text
  sensitivity: internal
  decode: asset_class

- id: risk.previous_asset_code
  table: silver.asset_classification_details
  column: ascd_prev_asset_code
  label: Previous asset classification
  synonyms: [previous classification, was classified, migration from]
  unit: text
  sensitivity: internal
  decode: asset_class
  description: Enables slippage/upgrade questions — what an account was classified as before this event.

- id: risk.effective_date
  table: silver.asset_classification_details
  column: ascd_effective_date
  label: Classification date
  synonyms: [classification date, as of date, effective date]
  unit: date
  sensitivity: internal
  description: >
    Event date, not a snapshot date. See tables.yaml — filtering by equality on this column
    is the single most dangerous mistake available in this schema.

- id: risk.principal_due
  table: silver.asset_classification_details
  column: ascd_princ_due
  label: Principal overdue
  synonyms: [principal due, principal overdue, principal arrears]
  unit: inr
  agg: [sum]
  sensitivity: internal

- id: risk.interest_due
  table: silver.asset_classification_details
  column: ascd_int_due
  label: Interest overdue
  synonyms: [interest due, interest overdue, interest arrears]
  unit: inr
  agg: [sum]
  sensitivity: internal

- id: risk.instalments_unpaid
  table: silver.asset_classification_details
  column: ascd_no_inst_not_paid
  label: Instalments unpaid
  synonyms: [instalments missed, unpaid instalments, EMIs missed, missed payments]
  unit: count
  agg: [sum, avg, max]
  sensitivity: internal

