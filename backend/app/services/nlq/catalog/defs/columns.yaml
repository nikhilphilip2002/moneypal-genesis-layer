  label: Charges deducted
  synonyms: [charges, fees, processing fee, deductions]
  unit: inr
  agg: [sum]
  sensitivity: internal

- id: disb.date
  table: silver.loan_disbursement_transactions
  column: genlndisb_disb_date
  label: Disbursement date
  synonyms: [disbursement date, release date, payout date, when disbursed]
  unit: date
  sensitivity: internal
  description: Range 2025-10-15 to 2026-06-30 only.

