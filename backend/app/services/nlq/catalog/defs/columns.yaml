# --- silver.gl_daily_balances -----------------------------------------------------------

- id: gl.account_code
  table: silver.gl_daily_balances
  column: glbbal_glacc_code
  label: GL account code
  synonyms: [GL code, ledger code, account head]
  unit: text
  sensitivity: internal

- id: gl.balance
  table: silver.gl_daily_balances
  column: glbbal_ac_bal
  label: GL balance
