# Curated Gold columns available to validated text-to-SQL. PII is intentionally cataloged
# for authorized borrower/agent/KYC questions; role checks, limits and audit still apply.

# Loan account hub
- {id: loan.entity_number, table: gold.loan_account_master, column: entity_num, label: Entity, unit: text}
- {id: loan.account_number, table: gold.loan_account_master, column: loan_account_number, label: Loan account number, unit: text}
- {id: loan.customer_id, table: gold.loan_account_master, column: customer_id, label: Customer ID, unit: text}
- {id: loan.customer_name, table: gold.loan_account_master, column: customer_name, label: Borrower name, unit: text, sensitivity: pii, synonyms: [borrower, customer name, client]}
- {id: loan.branch_code, table: gold.loan_account_master, column: branch_code, label: Branch, unit: text}
- {id: loan.product_code, table: gold.loan_account_master, column: product_code, label: Product code, unit: text}
- {id: loan.product_name, table: gold.loan_account_master, column: product_name, label: Product, unit: text}
- {id: loan.scheme_code, table: gold.loan_account_master, column: scheme_code, label: Scheme code, unit: text}
- {id: loan.scheme_name, table: gold.loan_account_master, column: scheme_name, label: Scheme, unit: text}
- {id: loan.loan_type, table: gold.loan_account_master, column: loan_type, label: Loan type, unit: text}
- {id: loan.sanction_date, table: gold.loan_account_master, column: sanction_date, label: Sanction date, unit: date}
- {id: loan.sanction_amount, table: gold.loan_account_master, column: sanction_amount, label: Sanction amount, unit: inr, agg: [sum, avg, max, min]}
- {id: loan.disbursed_amount, table: gold.loan_account_master, column: disbursed_amount, label: Cumulative disbursed amount, unit: inr, agg: [sum]}
- {id: loan.first_disbursement_date, table: gold.loan_account_master, column: first_disbursement_date, label: First disbursement date, unit: date}
- {id: loan.interest_rate, table: gold.loan_account_master, column: interest_rate, label: Interest rate, unit: percent, agg: [avg, max, min]}
- {id: loan.emi_amount, table: gold.loan_account_master, column: emi_amount, label: EMI amount, unit: inr, agg: [sum, avg]}
- {id: loan.principal_repaid, table: gold.loan_account_master, column: principal_repaid, label: Cumulative principal repaid, unit: inr, agg: [sum]}
- {id: loan.interest_repaid, table: gold.loan_account_master, column: interest_repaid, label: Cumulative interest repaid, unit: inr, agg: [sum]}
- {id: loan.last_payment_date, table: gold.loan_account_master, column: last_payment_date, label: Last payment date, unit: date}
- {id: loan.agent_code, table: gold.loan_account_master, column: agent_code, label: Agent code, unit: text}
- {id: loan.agent_name, table: gold.loan_account_master, column: agent_name, label: Agent name, unit: text, sensitivity: pii}
- {id: loan.closure_date, table: gold.loan_account_master, column: closure_date, label: Closure date, unit: date}
- {id: loan.status, table: gold.loan_account_master, column: loan_status, label: Loan status, unit: text}

# Event facts
- {id: disb.sequence, table: gold.loan_disbursement_events, column: disbursement_sequence, label: Disbursement sequence, unit: count}
- {id: disb.date, table: gold.loan_disbursement_events, column: disbursement_date, label: Disbursement date, unit: date}
- {id: disb.amount, table: gold.loan_disbursement_events, column: disbursement_amount, label: Disbursement amount, unit: inr, agg: [sum]}
- {id: disb.net_amount, table: gold.loan_disbursement_events, column: net_paid_amount, label: Net amount paid, unit: inr, agg: [sum]}
- {id: disb.customer_name, table: gold.loan_disbursement_events, column: customer_name, label: Borrower name, unit: text, sensitivity: pii}
- {id: repay.sequence, table: gold.loan_repayment_events, column: repayment_sequence, label: Repayment sequence, unit: count}
- {id: repay.date, table: gold.loan_repayment_events, column: repayment_date, label: Repayment date, unit: date}
- {id: repay.principal_due, table: gold.loan_repayment_events, column: principal_due, label: Principal due, unit: inr, agg: [sum]}
- {id: repay.interest_due, table: gold.loan_repayment_events, column: interest_due, label: Interest due, unit: inr, agg: [sum]}
- {id: repay.total_due, table: gold.loan_repayment_events, column: total_due, label: Total due, unit: inr, agg: [sum]}
- {id: repay.principal_paid, table: gold.loan_repayment_events, column: principal_paid, label: Principal paid, unit: inr, agg: [sum]}
- {id: repay.interest_paid, table: gold.loan_repayment_events, column: interest_paid, label: Interest paid, unit: inr, agg: [sum]}
- {id: repay.total_paid, table: gold.loan_repayment_events, column: total_paid, label: Total paid, unit: inr, agg: [sum]}
- {id: repay.shortfall, table: gold.loan_repayment_events, column: collection_shortfall, label: Collection shortfall, unit: inr, agg: [sum]}
- {id: repay.customer_name, table: gold.loan_repayment_events, column: customer_name, label: Borrower name, unit: text, sensitivity: pii}
- {id: schedule.sequence, table: gold.loan_schedule_events, column: instalment_sequence, label: Instalment sequence, unit: count}
- {id: schedule.date, table: gold.loan_schedule_events, column: scheduled_date, label: Scheduled date, unit: date}
- {id: schedule.principal, table: gold.loan_schedule_events, column: scheduled_principal, label: Scheduled principal, unit: inr, agg: [sum]}
- {id: schedule.interest, table: gold.loan_schedule_events, column: scheduled_interest, label: Scheduled interest, unit: inr, agg: [sum]}
- {id: schedule.total, table: gold.loan_schedule_events, column: scheduled_total, label: Scheduled total, unit: inr, agg: [sum]}

# Portfolio snapshot
- {id: risk.snapshot_date, table: gold.portfolio_daily_snapshot, column: snapshot_date, label: Snapshot date, unit: date}
- {id: risk.asset_code, table: gold.portfolio_daily_snapshot, column: asset_code, label: Asset classification, unit: text, decode: asset_class}
- {id: risk.asset_classification, table: gold.portfolio_daily_snapshot, column: asset_classification, label: Asset classification name, unit: text}
- {id: risk.dpd_days, table: gold.portfolio_daily_snapshot, column: dpd_days, label: Days past due, unit: days, agg: [avg, max]}
- {id: risk.principal_outstanding, table: gold.portfolio_daily_snapshot, column: principal_outstanding, label: Principal outstanding, unit: inr, agg: [sum]}
- {id: risk.principal_overdue, table: gold.portfolio_daily_snapshot, column: principal_overdue, label: Principal overdue, unit: inr, agg: [sum]}
- {id: risk.interest_overdue, table: gold.portfolio_daily_snapshot, column: interest_overdue, label: Interest overdue, unit: inr, agg: [sum]}
- {id: risk.total_overdue, table: gold.portfolio_daily_snapshot, column: total_overdue, label: Total overdue, unit: inr, agg: [sum]}
- {id: risk.customer_name, table: gold.portfolio_daily_snapshot, column: customer_name, label: Borrower name, unit: text, sensitivity: pii}

