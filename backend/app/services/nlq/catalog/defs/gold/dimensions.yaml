- id: branch
  label: Branch
  table: gold.loan_account_master
  column: branch_code
  type: categorical
  decode: branch
  synonyms: [branch, branches, location, office, centre, region, by branch]
  description: Application/origination branch. Reporting branch remains unavailable.
  cardinality: 2

- id: product
  label: Product
  table: gold.loan_account_master
  column: product_code
  type: categorical
  decode: product
  synonyms: [product, product line, loan type, business line, portfolio, segment]
  description: Core product code; approved reporting-product mappings are still pending.
  cardinality: 1

- id: scheme
  label: Scheme
  table: gold.loan_account_master
  column: scheme_code
  type: categorical
  decode: scheme
  synonyms: [scheme, sub-product, product scheme, loan scheme, purpose]
  description: Scheme is currently the meaningful product-level reporting breakdown.
  cardinality: 13

- id: asset_class
  label: Asset classification
  table: gold.portfolio_daily_snapshot
  column: asset_code
  type: categorical
  decode: asset_class
  synonyms: [asset class, classification, NPA status, SMA, standard, credit quality, bucket]
  description: RBI asset classification at the requested snapshot date.
  point_in_time: true
  cardinality: 5

- id: dpd_bucket
  label: DPD bucket
  table: gold.portfolio_daily_snapshot
  column: dpd_days
  type: categorical
  expression: >
    CASE WHEN {col} = 0 THEN '0 (current)'
         WHEN {col} BETWEEN 1 AND 30 THEN '1-30'
         WHEN {col} BETWEEN 31 AND 60 THEN '31-60'
         WHEN {col} BETWEEN 61 AND 90 THEN '61-90'
         ELSE '90+' END
  sort_expression: >
    CASE WHEN {col} = 0 THEN 0 WHEN {col} <= 30 THEN 1 WHEN {col} <= 60 THEN 2
         WHEN {col} <= 90 THEN 3 ELSE 4 END
  synonyms: [DPD bucket, ageing, overdue bucket, days past due band, delinquency bucket]
  description: Standard ageing bands at the requested portfolio snapshot.
  point_in_time: true

- id: loan_type
  label: Loan type
  table: gold.loan_account_master
  column: loan_type
  type: categorical
  decode: loan_type
  synonyms: [loan type, EMI or bullet, amortisation type, repayment type]

- id: account_status
  label: Account status
  table: gold.loan_account_master
  column: loan_status
  type: categorical
  synonyms: [status, detailed account status, active, NPA, sanctioned]

- id: open_closed_status
  label: Account state
  table: gold.loan_account_master
  column: loan_status
  type: categorical
  expression: >
    CASE WHEN UPPER(BTRIM(COALESCE({col}, ''))) = 'CLOSED' THEN 'Closed' ELSE 'Open' END
  sort_expression: >
    CASE WHEN UPPER(BTRIM(COALESCE({col}, ''))) = 'CLOSED' THEN 2 ELSE 1 END
  synonyms: [open or closed, open versus closed, open vs closed, account state, live or closed]
  description: >
    Binary lifecycle view: CLOSED is closed; ACTIVE, NPA and SANCTIONED accounts remain open.
  cardinality: 2

