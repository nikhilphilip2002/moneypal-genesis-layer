# Only reviewed, non-fan-out edges between the 18 semantic views are exposed.

- id: disbursement_to_loan
  left: gold.semantic_disbursement_event
  right: gold.semantic_loan_account
  on_columns: [[entity_num, entity_num], [loan_account_number, loan_account_number]]
  cardinality: many_to_one
  join_type: inner
  description: Disbursement events to their account-level labels and current attributes.

- id: repayment_to_loan
  left: gold.semantic_repayment_event
  right: gold.semantic_loan_account
  on_columns: [[entity_num, entity_num], [loan_account_number, loan_account_number]]
  cardinality: many_to_one
  join_type: inner
  description: Contractual repayment events to their loan accounts.

- id: schedule_to_loan
  left: gold.semantic_schedule_event
  right: gold.semantic_loan_account
  on_columns: [[entity_num, entity_num], [loan_account_number, loan_account_number]]
  cardinality: many_to_one
  join_type: inner
  description: Scheduled instalments to their loan accounts.

- id: portfolio_to_loan
  left: gold.semantic_portfolio_snapshot
  right: gold.semantic_loan_account
  on_columns: [[entity_num, entity_num], [loan_account_number, loan_account_number]]
  cardinality: many_to_one
  join_type: inner
  description: Portfolio snapshots to current account labels and reporting attributes.

- id: loan_to_customer
  left: gold.semantic_loan_account
  right: gold.semantic_customer_profile
  on_columns: [[entity_num, entity_num], [customer_id, customer_id]]
  cardinality: many_to_one
  join_type: left
  contains_pii: true
  description: Loan accounts to borrower profiles.

- id: application_to_loan
  left: gold.semantic_application
  right: gold.semantic_loan_account
  on_columns: [[entity_num, entity_num], [loan_account_number, loan_account_number]]
  cardinality: many_to_one
  join_type: left
  contains_pii: true
  description: Applications to a linked loan account where observable linkage exists.

- id: receipt_adjustment_to_loan
  left: gold.semantic_receipt_adjustment_event
  right: gold.semantic_loan_account
  on_columns: [[entity_num, entity_num], [loan_account_number, loan_account_number]]
  cardinality: many_to_one
  join_type: left
  contains_pii: true
  description: Receipt and waiver events to their current loan account.

- id: ledger_event_to_loan
  left: gold.semantic_loan_ledger_event
  right: gold.semantic_loan_account
  on_columns: [[entity_num, entity_num], [loan_account_number, loan_account_number]]
  cardinality: many_to_one
  join_type: left
  contains_pii: true
  description: Ledger movements and balance events to their current loan account.
