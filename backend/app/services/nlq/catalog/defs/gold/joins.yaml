# Only reviewed, non-fan-out edges between the 18 friendly views are exposed.

- id: disbursement_to_loan
  left: gold.loan_disbursements
  right: gold.loan_accounts
  on_columns: [[company_code, company_code], [loan_account_number, loan_account_number]]
  cardinality: many_to_one
  join_type: inner
  description: Disbursement events to their account-level labels and current attributes.

- id: repayment_to_loan
  left: gold.loan_repayments
  right: gold.loan_accounts
  on_columns: [[company_code, company_code], [loan_account_number, loan_account_number]]
  cardinality: many_to_one
  join_type: inner
  description: Contractual repayment events to their loan accounts.

- id: schedule_to_loan
  left: gold.emi_schedule
  right: gold.loan_accounts
  on_columns: [[company_code, company_code], [loan_account_number, loan_account_number]]
  cardinality: many_to_one
  join_type: inner
  description: Scheduled instalments to their loan accounts.

- id: portfolio_to_loan
  left: gold.daily_loan_status
  right: gold.loan_accounts
  on_columns: [[company_code, company_code], [loan_account_number, loan_account_number]]
  cardinality: many_to_one
  join_type: inner
  description: Portfolio snapshots to current account labels and reporting attributes.

- id: loan_to_customer
  left: gold.loan_accounts
  right: gold.customers
  on_columns: [[company_code, company_code], [customer_id, customer_id]]
  cardinality: many_to_one
  join_type: left
  contains_pii: true
  description: Loan accounts to borrower profiles.

- id: application_to_loan
  left: gold.loan_applications
  right: gold.loan_accounts
  on_columns: [[company_code, company_code], [loan_account_number, loan_account_number]]
  cardinality: many_to_one
  join_type: left
  contains_pii: true
  description: Applications to a linked loan account where observable linkage exists.

- id: receipt_adjustment_to_loan
  left: gold.payment_receipts
  right: gold.loan_accounts
  on_columns: [[company_code, company_code], [loan_account_number, loan_account_number]]
  cardinality: many_to_one
  join_type: left
  contains_pii: true
  description: Receipt and waiver events to their current loan account.

- id: ledger_event_to_loan
  left: gold.loan_account_entries
  right: gold.loan_accounts
  on_columns: [[company_code, company_code], [loan_account_number, loan_account_number]]
  cardinality: many_to_one
  join_type: left
  contains_pii: true
  description: Ledger movements and balance events to their current loan account.
