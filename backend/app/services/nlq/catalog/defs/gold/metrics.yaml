# Metrics resolve to governed Gold views. The LLM selects metric ids; this file decides
# the physical source and formula deterministically.

- id: disbursement_total
  label: Disbursement
  unit: inr
  grain: flow
  base_table: gold.loan_disbursement_events
  date_column: disbursement_date
  expression: SUM({t}.disbursement_amount)
  formula: Sum of disbursement event amounts in the period
  synonyms: [disbursement, disbursed, released, paid out, payouts, drawdown]
  verified: 2266908902.00 across 5696 events through 2026-07-31

- id: disbursement_count
  label: Number of disbursements
  unit: count
  grain: flow
  base_table: gold.loan_disbursement_events
  date_column: disbursement_date
  expression: COUNT(*)
  formula: Count of disbursement events in the period
  synonyms: [disbursement count, number of disbursements, how many disbursements]
  verified: 5696

- id: sanctioned_amount
  label: Sanctioned amount
  unit: inr
  grain: flow
  base_table: gold.loan_account_master
  date_column: sanction_date
  expression: SUM({t}.sanction_amount)
  formula: Sum of sanctioned amounts for accounts sanctioned in the period
  synonyms: [sanctioned, sanction, approved amount, credit approved]
  verified: 2290958902.00 across 5753 accounts

- id: loan_count
  label: Loans sanctioned
  unit: count
  grain: flow
  base_table: gold.loan_account_master
  date_column: sanction_date
  expression: COUNT(*)
  formula: Count of loan accounts sanctioned in the period
  synonyms: [loan count, number of loans, how many loans, accounts, new loans, bookings]
  verified: 5753

- id: customer_count
  label: Borrowers
  unit: count
  grain: flow
  base_table: gold.loan_account_master
  date_column: sanction_date
  expression: COUNT(DISTINCT {t}.customer_id)
  formula: Distinct borrowers with an account sanctioned in the period
  synonyms: [customers, borrowers, unique customers, how many borrowers, clients]

- id: avg_ticket_size
  label: Average ticket size
  unit: inr
  grain: ratio
  base_table: gold.loan_account_master
  date_column: sanction_date
  numerator: SUM({t}.sanction_amount)
  denominator: COUNT(*)
  formula: Total sanctioned amount divided by number of loans
  # Account count — the ratio's denominator. Named so driver decomposition can split a change into
  # mix and rate effects exactly rather than approximately.
  weight_metric: loan_count
  synonyms: [average ticket, ticket size, average loan size, avg loan amount]

- id: avg_interest_rate
  label: Average interest rate
  unit: percent
  grain: ratio
  base_table: gold.loan_account_master
  date_column: sanction_date
  numerator: SUM({t}.interest_rate * {t}.sanction_amount)
  denominator: SUM({t}.sanction_amount)
  formula: Sanction-amount-weighted average account interest rate
  # Sanctioned amount — the ratio's denominator. Named so driver decomposition can split a change into
  # mix and rate effects exactly rather than approximately.
  weight_metric: sanctioned_amount
  synonyms: [interest rate, average rate, yield, ROI, pricing]
  requires_signoff: true

- id: principal_outstanding_book
  label: Principal outstanding (whole book)
  unit: inr
  grain: point_in_time
  base_table: gold.loan_account_master
  expression: SUM({t}.disbursed_amount - {t}.principal_repaid)
  formula: Cumulative disbursed minus cumulative principal repaid across loan accounts
  synonyms: [total outstanding, whole book, total portfolio, loan book size]
  no_time_travel: true
  caveat: >
    This account-level derivation is ₹213.998 Cr and does not yet reconcile to the Silver
    loan-master value of ₹213.022 Cr. Treat it as provisional.

- id: agent_linked_loans
  label: Linked loans
  unit: count
  grain: point_in_time
  base_table: gold.agent_master
  expression: SUM({t}.linked_loan_count)
  formula: Sum of loan accounts linked to each governed agent
  synonyms: [top agents, agent ranking, loans by agent, agent performance, linked loans]
  no_time_travel: true

- id: principal_outstanding
  label: Principal outstanding
  unit: inr
  grain: point_in_time
  base_table: gold.portfolio_daily_snapshot
  as_of_function: gold.portfolio_snapshot_as_of
  expression: SUM({t}.principal_outstanding)
  formula: Principal outstanding from each classified account at the requested snapshot
  synonyms: [outstanding, principal outstanding, POS, book size, exposure, AUM]
  verified: 2045394519.25 across 5466 classified accounts as of 2026-07-31

- id: classified_account_count
  label: Classified loan accounts
  unit: count
  grain: point_in_time
  base_table: gold.portfolio_daily_snapshot
  as_of_function: gold.portfolio_snapshot_as_of
  expression: COUNT(*)
  formula: Count of loan accounts present in the requested classified portfolio snapshot
  synonyms: [classified accounts, accounts by asset class, loan accounts by classification]
  verified: 5466 classified accounts as of 2026-07-31

- id: overdue_principal
  label: Overdue principal
  unit: inr
  grain: point_in_time
  base_table: gold.portfolio_daily_snapshot
  as_of_function: gold.portfolio_snapshot_as_of
  expression: SUM({t}.principal_overdue)
  formula: Principal overdue at the requested portfolio snapshot
  synonyms: [overdue, arrears, past due, principal due, delinquent amount]
  verified: 1957196.06 as of 2026-07-31

- id: overdue_total
  label: Total overdue
  unit: inr
  grain: point_in_time
  base_table: gold.portfolio_daily_snapshot
  as_of_function: gold.portfolio_snapshot_as_of
  expression: SUM({t}.total_overdue)
  formula: Principal, interest, charges and penal overdue at the requested snapshot
  synonyms: [total overdue, total arrears, total dues, amount overdue]

- id: delinquent_account_count
  label: Delinquent accounts
  unit: count
  grain: point_in_time
  base_table: gold.portfolio_daily_snapshot
  as_of_function: gold.portfolio_snapshot_as_of
  expression: COUNT(*) FILTER (WHERE {t}.is_delinquent)
  formula: Count of classified accounts with DPD greater than zero
  synonyms: [delinquent accounts, accounts overdue, how many are late, defaulters]

- id: avg_dpd
  label: Average DPD
  unit: days
  grain: ratio
  base_table: gold.portfolio_daily_snapshot
  as_of_function: gold.portfolio_snapshot_as_of
  numerator: SUM({t}.dpd_days)
  denominator: COUNT(*)
  formula: Mean days past due across classified accounts at the snapshot
  synonyms: [average DPD, mean days past due, average delinquency]

- id: par_30
  label: PAR 30
  unit: percent
  grain: ratio
  point_in_time: true
  base_table: gold.portfolio_daily_snapshot
  as_of_function: gold.portfolio_snapshot_as_of
  numerator: SUM({t}.principal_outstanding) FILTER (WHERE {t}.is_par30)
  denominator: SUM({t}.principal_outstanding)
  scale: 100
  formula: Principal outstanding over 30 DPD divided by classified principal outstanding
  # Book size — the ratio's denominator. Named so driver decomposition can split a change into
  # mix and rate effects exactly rather than approximately.
  weight_metric: principal_outstanding
  synonyms: [PAR, PAR 30, portfolio at risk, par30, 30+ DPD]
  requires_signoff: true
  signoff_note: >
    Denominator is principal outstanding on the classified subset, currently 5,466 of
    5,753 loan accounts. Client must ratify this denominator for board reporting.
  verified: 0.2685526473% as of 2026-07-31

- id: par_60
  label: PAR 60
  unit: percent
  grain: ratio
  point_in_time: true
  base_table: gold.portfolio_daily_snapshot
  as_of_function: gold.portfolio_snapshot_as_of
  numerator: SUM({t}.principal_outstanding) FILTER (WHERE {t}.is_par60)
  denominator: SUM({t}.principal_outstanding)
  scale: 100
  formula: Principal outstanding over 60 DPD divided by classified principal outstanding
  # Book size — the ratio's denominator. Named so driver decomposition can split a change into
  # mix and rate effects exactly rather than approximately.
  weight_metric: principal_outstanding
  synonyms: [PAR 60, par60, 60+ DPD]
  requires_signoff: true

- id: par_90
  label: PAR 90
  unit: percent
  grain: ratio
  point_in_time: true
  base_table: gold.portfolio_daily_snapshot
  as_of_function: gold.portfolio_snapshot_as_of
  numerator: SUM({t}.principal_outstanding) FILTER (WHERE {t}.is_par90)
  denominator: SUM({t}.principal_outstanding)
  scale: 100
  formula: Principal outstanding over 90 DPD divided by classified principal outstanding
  # Book size — the ratio's denominator. Named so driver decomposition can split a change into
  # mix and rate effects exactly rather than approximately.
  weight_metric: principal_outstanding
  synonyms: [PAR 90, par90, 90+ DPD]
  requires_signoff: true

- id: npa_ratio
  label: NPA ratio
  unit: percent
  grain: ratio
  point_in_time: true
  base_table: gold.portfolio_daily_snapshot
  as_of_function: gold.portfolio_snapshot_as_of
  numerator: SUM({t}.principal_outstanding) FILTER (WHERE {t}.is_npa)
  denominator: SUM({t}.principal_outstanding)
  scale: 100
  formula: NPA-classified principal outstanding divided by classified principal outstanding
  # Book size — the ratio's denominator. Named so driver decomposition can split a change into
  # mix and rate effects exactly rather than approximately.
  weight_metric: principal_outstanding
  synonyms: [NPA ratio, gross NPA, GNPA, bad loan ratio, non performing]
  requires_signoff: true

- id: collection_efficiency
  label: Collection efficiency
  unit: percent
  grain: ratio
  base_table: gold.loan_repayment_events
  date_column: repayment_date
  numerator: SUM({t}.total_paid)
  denominator: SUM({t}.total_due)
  scale: 100
  formula: Total principal and interest paid divided by total principal and interest due
  # Total due — the ratio's denominator. Named so driver decomposition can split a change into
  # mix and rate effects exactly rather than approximately.
  weight_metric: amount_due
  synonyms: [collection efficiency, recovery rate, collections, CE, repayment rate]
  verified: 98.770481% over 18836 repayment events

- id: amount_collected
  label: Amount collected
  unit: inr
  grain: flow
  base_table: gold.loan_repayment_events
  date_column: repayment_date
  expression: SUM({t}.total_paid)
  formula: Principal plus interest paid in the period
  synonyms: [collected, collections, received, repayments, recovery, inflow]
  verified: 227742182.62

- id: principal_collected
  label: Principal collected
  unit: inr
  grain: flow
  base_table: gold.loan_repayment_events
  date_column: repayment_date
  expression: SUM({t}.principal_paid)
  formula: Principal paid in the period
  synonyms: [principal collected, principal repaid, principal recovery, principle paid]

- id: interest_collected
  label: Interest collected
  unit: inr
  grain: flow
  base_table: gold.loan_repayment_events
  date_column: repayment_date
  expression: SUM({t}.interest_paid)
  formula: Interest paid in the period
  synonyms: [interest collected, interest paid, interest recovery]

- id: amount_due
  label: Amount due
  unit: inr
  grain: flow
  base_table: gold.loan_repayment_events
  date_column: repayment_date
  expression: SUM({t}.total_due)
  formula: Principal plus interest due in the period
  synonyms: [due, demand, billed, amount due, expected collection]
  verified: 230577194.96

- id: collection_shortfall
  label: Collection shortfall
  unit: inr
  grain: flow
  base_table: gold.loan_repayment_events
  date_column: repayment_date
  expression: SUM({t}.collection_shortfall)
  formula: Amount due minus amount paid in the period
  synonyms: [shortfall, gap, unpaid, missed collections, under recovery]

- id: scheduled_amount
  label: Scheduled instalments
  unit: inr
  grain: flow
  base_table: gold.loan_schedule_events
  date_column: scheduled_date
  expression: SUM({t}.scheduled_total)
  formula: Contractual principal plus interest scheduled in the period
  synonyms: [scheduled, falling due, upcoming dues, expected inflow, amortisation]

- id: gl_balance
  label: GL balance
  unit: inr
  grain: point_in_time
  base_table: gold.gl_daily_balances
  as_of_column: balance_date
  as_of_key: [entity_num, branch_code, gl_number, currency_code]
  expression: SUM({t}.base_currency_balance)
  formula: Base-currency GL closing balance at the requested date
  synonyms: [GL balance, ledger balance, trial balance, account balance, financials]
  restrictions: Cannot be grouped by loan product, scheme or loan branch.
  requires_signoff: true

# Oracle operational facts promoted to Gold on 2026-08-20.
- id: application_count
  label: Applications received
  unit: count
  grain: flow
  base_table: gold.loan_application_master
  date_column: application_date
  expression: COUNT(*)
  formula: Count of application master records entered in the period
  synonyms: [applications, applications received, application volume, leads received]
  verified: 9021 applications in the available source history

- id: observable_disbursed_application_count
  label: Applications observed as disbursed
  unit: count
  grain: flow
  base_table: gold.loan_application_outcomes
  date_column: application_date
  expression: COUNT(*) FILTER (WHERE {t}.outcome_status = 'disbursed')
  formula: Applications carrying either an explicit disbursement record or a linked loan account
  synonyms: [applications disbursed, converted applications, application outcomes]
  requires_signoff: true
  signoff_note: >
    This is an observable outcome, not an approval count. Of 7,515 rows labelled disbursed,
    1,822 lack a disbursement date/amount and 44 rely only on account linkage.

- id: observable_application_conversion_rate
  label: Observable application-to-disbursement conversion
  unit: percent
  grain: ratio
  base_table: gold.loan_application_outcomes
  date_column: application_date
  numerator: COUNT(*) FILTER (WHERE {t}.outcome_status = 'disbursed')
  denominator: COUNT(*)
  scale: 100
  formula: Applications observed as disbursed divided by all application records in the period
  synonyms: [application conversion, application to disbursement rate, observable conversion]
  requires_signoff: true
  signoff_note: >
    This is not a stage conversion or approval rate. Applications not observed as disbursed
    must not be called rejected or declined.

- id: receipt_total
  label: Payment receipts
  unit: inr
  grain: flow
  base_table: gold.payment_receipt_events
  date_column: receipt_date
  expression: SUM({t}.receipt_amount)
  formula: Sum of governed loan receipt amounts in the period
  synonyms: [receipts, cash collected, payments received, recovery receipts]
  verified: 464832760.700 across 46144 receipts through 2026-07-31

- id: receipt_count
  label: Number of payment receipts
  unit: count
  grain: flow
  base_table: gold.payment_receipt_events
  date_column: receipt_date
  expression: COUNT(*)
  formula: Count of governed loan receipt events in the period
  synonyms: [receipt count, payment count, number of receipts]
  verified: 46144 receipts

- id: loan_ledger_transaction_count
  label: Loan ledger transactions
  unit: count
  grain: flow
  base_table: gold.loan_ledger_events
  date_column: transaction_date
  expression: COUNT(*)
  formula: Count of loan account ledger transactions in the period
  synonyms: [ledger transactions, loan transactions, account movements]
  verified: 94124 unique transaction keys

- id: collection_activity_total
  label: Collection activity amount
  unit: inr
  grain: flow
  base_table: gold.collection_activity_events
  date_column: activity_date
  expression: SUM({t}.final_collection_amount)
  formula: Sum of final collection amounts recorded in collector activity summaries
  synonyms: [collector amount, team collections, field collections, collection activity amount]

- id: collection_handover_count
  label: Collection handovers
  unit: count
  grain: flow
  base_table: gold.collection_handover_events
  date_column: handover_date
  expression: COUNT(*)
  formula: Count of collection ownership handover records in the period
  synonyms: [handovers, collector reassignments, collection transfers]
  verified: 174 handover records

- id: vintage_par30_rate
  label: Vintage PAR 30 account rate
  unit: percent
  grain: ratio
  base_table: gold.origination_vintage_matrix
  date_column: report_month
  numerator: SUM({t}.accounts_par30)
  denominator: SUM({t}.account_count)
  scale: 100
  formula: PAR-30 account count divided by cohort account count at each report month
  synonyms: [vintage PAR 30, cohort PAR 30, vintage delinquency]
  requires_signoff: true
  signoff_note: This is an account-count rate, not an outstanding-balance PAR ratio.

- id: vintage_npa_rate
  label: Vintage NPA account rate
  unit: percent
  grain: ratio
  base_table: gold.origination_vintage_matrix
  date_column: report_month
  numerator: SUM({t}.accounts_npa)
  denominator: SUM({t}.account_count)
  scale: 100
  formula: NPA account count divided by cohort account count at each report month
  synonyms: [vintage NPA, cohort NPA, NPA by vintage]
  requires_signoff: true
  signoff_note: This is an account-count rate over the nine-month source window.
