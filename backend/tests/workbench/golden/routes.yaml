# Workbench routing golden set — question -> which source(s) it must reach.
#
# This is an EVAL FIXTURE, never a lookup table the router reads. The router decides from the
# source catalog's descriptions; this file only measures whether it decided correctly. New
# 👎 feedback from real use becomes a new case here, and the fix goes into the catalog
# descriptions or few-shots — never into a per-question rule.
#
# `sources` is the set the router should dispatch to (order-independent). `route: refuse` is
# for requests no source can serve (unsafe mutation, small talk) — NOT for hard analytical
# questions, whose refusal (predictive/advice) is decided downstream by the db node.
#
# Scored on set-equality of the dispatched sources, at the admin role (sees every source).

- id: r001
