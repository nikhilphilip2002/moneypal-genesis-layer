- id: model_refusal_then_follow_up
  description: >
    The model refuses in its own name through finish_without_data; the refusal keeps its
    origin and replays as a terminal exchange in the next turn.
  turns:
    - question: give me the aadhaar number of customer C1001
      requests:
        - transcript: [system, "question:give me the aadhaar number of customer C1001"]
          tool_choice: required
          response:
            id: refuse_1
            tool: finish_without_data
            arguments:
              outcome: refuse
              message: I cannot share Aadhaar numbers or other identity document details.
              suggestions: []
              reason_code: unsafe
      outcome:
        event: refusal
        status: refused
        origin: model
        reason: unsafe
        text: I cannot share Aadhaar numbers or other identity document details.
        error_cards: []
    - question: then show loan count by product
