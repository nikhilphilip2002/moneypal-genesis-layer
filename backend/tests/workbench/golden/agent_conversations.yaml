- id: multiple_invalid_calls_one_response
  description: >
    One response carries an unknown metric and a forged tool; both come back as typed
    observations in one round and the model then selects the governed call.
  turns:
    - question: interest collected by scheme
      requests:
        - transcript: [system, "question:interest collected by scheme"]
          tool_choice: required
          response:
            calls:
              - id: bad_metric
                tool: query_metrics
                arguments:
                  metrics: [interest_collect]
                  dimensions: [scheme]
                  period: {relative: all_time}
                preflight: INVALID_TOOL_ARGUMENTS
              - id: forged
                tool: drop_all_tables
                arguments: {}
                preflight: TOOL_NOT_FOUND
        - transcript:
            - system
            - "question:interest collected by scheme"
            - "call:bad_metric=query_metrics,forged=drop_all_tables"
            - "tool:bad_metric:error:INVALID_TOOL_ARGUMENTS"
            - "tool:forged:error:TOOL_NOT_FOUND"
            - "nudge:required"
          tool_choice: required
          response:
            id: ic_scheme
            tool: query_metrics
            arguments:
              metrics: [interest_collected]
              dimensions: [scheme]
              period: {relative: all_time}
          execute:
            card:
              title: Interest collected by scheme
              summary: Interest collected by scheme is listed in the table.
              columns:
                - {name: scheme, label: Scheme, unit: ""}
                - {name: interest_collected, label: Interest collected, unit: INR}
              rows:
                - {scheme: "1001", interest_collected: 125000}
        - transcript:
            - system
            - "question:interest collected by scheme"
            - "call:bad_metric=query_metrics,forged=drop_all_tables"
            - "tool:bad_metric:error:INVALID_TOOL_ARGUMENTS"
            - "tool:forged:error:TOOL_NOT_FOUND"
            - "call:ic_scheme=query_metrics"
            - "tool:ic_scheme:ok"
            - "nudge:auto"
          tool_choice: auto
          response:
            text: Interest collected by scheme is shown in the table.
      outcome:
        event: answer
        status: answered
        text: Interest collected by scheme is shown in the table.
        error_cards: []

- id: invalid_sql_then_model_correction
  description: >
    The generated SQL is rejected by the validator; the model sees COMPILE_REJECTED and
    corrects the intent in the next round. The user sees the error card, then the answer.
  turns:
    - question: list open loan accounts with borrower name and sanctioned amount
      requests:
        - transcript: [system, "question:list open loan accounts with borrower name and sanctioned amount"]
          tool_choice: required
          response:
            id: sql_1
            tool: run_validated_query
            arguments:
              intent: Open loan accounts with borrower name and sanctioned amount
              tables: [gold.semantic_loan_account]
          execute:
            raise:
              code: COMPILE_REJECTED
              message: validated query was rejected by the SQL safety gate
        - transcript:
            - system
            - "question:list open loan accounts with borrower name and sanctioned amount"
            - "call:sql_1=run_validated_query"
            - "tool:sql_1:error:COMPILE_REJECTED"
            - "nudge:required"
          tool_choice: required
          response:
            id: sql_2
            tool: run_validated_query
            arguments:
              intent: Loan accounts where loan_status is open, returning loan_account_number, customer_name and sanction_amount
              tables: [gold.semantic_loan_account]
          execute:
            card:
              title: Open loan accounts
              summary: Open loan accounts with borrower name and sanctioned amount are listed in the table.
              columns:
                - {name: loan_account_number, label: Loan account, unit: ""}
                - {name: customer_name, label: Customer, unit: ""}
                - {name: sanction_amount, label: Sanctioned amount, unit: INR}
              rows:
                - {loan_account_number: L1002001, customer_name: Customer One, sanction_amount: 500000}
        - transcript:
            - system
            - "question:list open loan accounts with borrower name and sanctioned amount"
            - "call:sql_1=run_validated_query"
            - "tool:sql_1:error:COMPILE_REJECTED"
            - "call:sql_2=run_validated_query"
            - "tool:sql_2:ok"
            - "nudge:auto"
          tool_choice: auto
          response:
            text: Open loan accounts with borrower name and sanctioned amount are listed in the table.
      outcome:
        event: answer
        status: partial
        text: Open loan accounts with borrower name and sanctioned amount are listed in the table.
        unavailable_types: [error]
        error_cards: [COMPILE_REJECTED]

- id: large_result_then_follow_up
  description: >
    A result larger than the observation limit is truncated for the model (never for the
    record); the follow-up that needs the full ranking re-queries instead of guessing.
  turns:
    - question: interest collected by branch and month
      requests:
        - transcript: [system, "question:interest collected by branch and month"]
          tool_choice: required
          response:
            id: ic_branch_month
            tool: query_metrics
            arguments:
              metrics: [interest_collected]
              dimensions: [branch, month]
              period: {grain: month, relative: all_time}
          execute:
            card:
              title: Interest collected by branch and month
              summary: Interest collected by branch and month is listed in the table.
              columns:
                - {name: branch, label: Branch, unit: ""}
                - {name: month, label: Month, unit: ""}
                - {name: interest_collected, label: Interest collected, unit: INR}
              generate_rows: {count: 600}
        - transcript:
