# Native-agent multi-turn regression conversations (plan.md section 8, F.1).
#
# Every conversation lists its turns; every turn lists the model requests the agent must
# make, in order. For each request:
#
#   transcript   the exact shape of the message list the model receives, in order:
#                system | question:<this turn's question> | user:<replayed question> |
#                call:<id>=<tool>[,<id>=<tool>] | tool:<id>:<status>[:<code>][:truncated] |
#                assistant:<replayed answer text> | nudge:<required|auto|none>
#                Only the current round's nudge is sent; earlier nudges are recorded in
#                the turn's events but never replayed.
#   tool_choice  what the agent asks for on that request
#   response     the structured call(s) the model must return (tool + exact arguments),
#                or `text` for the final answer. `preflight` names the typed error the
#                application must return for a call that may never execute.
#   execute      the canned tool result, one per call by position: `card` or `raise`.
#
# `outcome` is the visible end of the turn read from the emit queue: an answer or refusal
# event with its status/origin/reason, error cards streamed on the way, or the exception
# the graph turns into an error frame. Scoring compares structure only; no regex is run
# over model output. Every id below is a governed catalog id (see
# test_expected_calls_use_only_governed_catalog_ids).

- id: interest_collected_scheme_wise
  description: interest collected broken down by scheme
  turns:
    - question: interest collected scheme wise
      requests:
        - transcript: [system, "question:interest collected scheme wise"]
          tool_choice: required
          response:
            id: ic_scheme
            tool: query_metrics
            arguments:
              metrics: [interest_collected]
              dimensions: [scheme]
              period: {relative: all_time}
          execute:
            card:
              title: Interest collected by scheme
              summary: Interest collected by scheme is listed in the table.
              columns:
                - {name: scheme, label: Scheme, unit: ""}
                - {name: interest_collected, label: Interest collected, unit: INR}
              rows:
                - {scheme: "1001", interest_collected: 125000}
                - {scheme: "1005", interest_collected: 98000}
        - transcript:
            - system
            - "question:interest collected scheme wise"
            - "call:ic_scheme=query_metrics"
            - "tool:ic_scheme:ok"
            - "nudge:auto"
          tool_choice: auto
          response:
            text: Interest collected by scheme is shown in the table.
      outcome:
        event: answer
        status: answered
        text: Interest collected by scheme is shown in the table.
        error_cards: []

