- id: vanitha_customers_then_tenure_and_sanction
  description: >
    The named-agent lookup, then a refinement that must keep the agent constraint and the
    identity fields and add tenure and sanctioned amount.
  turns:
    - question: customers under vanitha
      requests:
        - transcript: [system, "question:customers under vanitha"]
          tool_choice: required
          response:
            id: lookup_vanitha
            tool: lookup_records
            arguments:
              selector: agent_name
              value: vanitha
              detail: agent_customers
              requested_fields: [borrower_name]
          execute:
            card:
              title: Customers under agent Vanitha
              summary: Customers linked to agent Vanitha are listed in the table.
              columns:
                - {name: customer_id, label: Customer ID, unit: ""}
                - {name: borrower_name, label: Borrower, unit: ""}
              rows:
                - {customer_id: "C1001", borrower_name: Customer One}
                - {customer_id: "C1002", borrower_name: Customer Two}
        - transcript:
            - system
            - "question:customers under vanitha"
            - "call:lookup_vanitha=lookup_records"
            - "tool:lookup_vanitha:ok"
            - "nudge:auto"
          tool_choice: auto
          response:
            text: The customers linked to agent Vanitha are listed in the table.
      outcome:
        event: answer
        status: answered
        text: The customers linked to agent Vanitha are listed in the table.
        error_cards: []
    - question: include tenure and sanctioned amount with the above details
      requests:
        - transcript:
            - system
            - "user:customers under vanitha"
            - "call:lookup_vanitha=lookup_records"
            - "tool:lookup_vanitha:ok"
            - "assistant:The customers linked to agent Vanitha are listed in the table."
            - "question:include tenure and sanctioned amount with the above details"
          tool_choice: required
          response:
            id: lookup_vanitha_detail
            tool: lookup_records
            arguments:
              selector: agent_name
              value: vanitha
              detail: agent_customers
              requested_fields: [borrower_name, number_of_emis, sanction_amount]
          execute:
            card:
              title: Customers under agent Vanitha with tenure and sanctioned amount
              summary: Customers linked to agent Vanitha with tenure and sanctioned amount are listed in the table.
              columns:
                - {name: customer_id, label: Customer ID, unit: ""}
                - {name: borrower_name, label: Borrower, unit: ""}
                - {name: number_of_emis, label: Tenure (EMIs), unit: count}
                - {name: sanction_amount, label: Sanctioned amount, unit: INR}
              rows:
                - {customer_id: "C1001", borrower_name: Customer One, number_of_emis: 24, sanction_amount: 150000}
                - {customer_id: "C1002", borrower_name: Customer Two, number_of_emis: 36, sanction_amount: 240000}
        - transcript:
            - system
            - "user:customers under vanitha"
            - "call:lookup_vanitha=lookup_records"
            - "tool:lookup_vanitha:ok"
            - "assistant:The customers linked to agent Vanitha are listed in the table."
            - "question:include tenure and sanctioned amount with the above details"
            - "call:lookup_vanitha_detail=lookup_records"
            - "tool:lookup_vanitha_detail:ok"
            - "nudge:auto"
          tool_choice: auto
          response:
            text: The same customers are shown again with their tenure and sanctioned amount.
      outcome:
        event: answer
        status: answered
        text: The same customers are shown again with their tenure and sanctioned amount.
        error_cards: []

