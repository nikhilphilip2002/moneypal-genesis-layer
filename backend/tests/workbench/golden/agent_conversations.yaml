  description: >
    One result is retrieved, then the model asks for two more calls than the per-turn call
    budget allows; the retrieved result is answered from with an agent limitation.
  settings: {max_calls: 2}
  turns:
    - question: interest collected by branch
      requests:
        - transcript: [system, "question:interest collected by branch"]
          tool_choice: required
          response:
            id: ic_branch
            tool: query_metrics
