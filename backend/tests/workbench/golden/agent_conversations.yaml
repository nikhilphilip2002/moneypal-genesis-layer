- id: forged_continuation_tool
  description: >
    After a real result the model calls a tool that does not exist; the application returns
    TOOL_NOT_FOUND as an observation, never executes it, and the model answers.
  turns:
    - question: interest collected by branch
      requests:
        - transcript: [system, "question:interest collected by branch"]
          tool_choice: required
          response:
            id: ic_branch
            tool: query_metrics
            arguments:
              metrics: [interest_collected]
              dimensions: [branch]
              period: {relative: all_time}
          execute:
            card:
              title: Interest collected by branch
              summary: Interest collected by branch is listed in the table.
              columns:
                - {name: branch, label: Branch, unit: ""}
                - {name: interest_collected, label: Interest collected, unit: INR}
              rows:
                - {branch: "1002", interest_collected: 64000}
        - transcript:
            - system
            - "question:interest collected by branch"
            - "call:ic_branch=query_metrics"
            - "tool:ic_branch:ok"
            - "nudge:auto"
          tool_choice: auto
          response:
            id: forged
            tool: export_customer_pii
            arguments: {}
            preflight: TOOL_NOT_FOUND
        - transcript:
            - system
            - "question:interest collected by branch"
            - "call:ic_branch=query_metrics"
            - "tool:ic_branch:ok"
            - "call:forged=export_customer_pii"
            - "tool:forged:error:TOOL_NOT_FOUND"
            - "nudge:auto"
          tool_choice: auto
          response:
            text: Interest collected by branch is shown in the table.
      outcome:
        event: answer
        status: answered
        text: Interest collected by branch is shown in the table.
        error_cards: []

- id: rounds_budget_exhausted
  description: >
    With the minimum round budget the model sends an invalid call twice; the turn ends with
    BudgetExhausted (the graph renders it as an error frame) and no fabricated call.
  settings: {max_rounds: 2}
  turns:
    - question: interest collected scheme wise
      requests:
        - transcript: [system, "question:interest collected scheme wise"]
          tool_choice: required
          response:
            id: bad_1
            tool: query_metrics
            arguments: {}
            preflight: INVALID_TOOL_ARGUMENTS
        - transcript:
            - system
            - "question:interest collected scheme wise"
            - "call:bad_1=query_metrics"
            - "tool:bad_1:error:INVALID_TOOL_ARGUMENTS"
            - "nudge:required"
          tool_choice: required
          response:
            id: bad_2
            tool: query_metrics
            arguments: {}
            preflight: INVALID_TOOL_ARGUMENTS
      outcome:
        raises: BudgetExhausted
        error_cards: []

