# --- Filtered questions (enum decoding) -------------------------------------------------

- id: g060
  question: How much have we disbursed in gold loans?
  category: enum_decode
  route: queryspec
  note: "'gold loans' must resolve to product code 1 through the enum synonyms."
  spec:
    metrics: [disbursement_total]
    filters: [{field: product, op: eq, value: "1"}]
    period: {relative: all_time}

- id: g061
  question: Show MSME loans by branch
  category: enum_decode
  route: queryspec
  spec:
    metrics: [loan_count]
    dimensions: [branch]
    filters: [{field: product, op: eq, value: "16"}]
    period: {relative: all_time}

- id: g062
  question: What is the outstanding for microfinance?
  category: enum_decode
  route: queryspec
  spec:
    metrics: [principal_outstanding]
    filters: [{field: product, op: eq, value: "13"}]
    period: {relative: today}

- id: g063
  question: How many loans has the Aluva branch given out?
  category: enum_decode
  route: queryspec
  note: Branch names come from the client listing in EDA §4; no branch master exists.
  spec:
    metrics: [loan_count]
    filters: [{field: branch, op: eq, value: "1002"}]
    period: {relative: all_time}

- id: g064
  question: Show me NPA accounts by branch
  category: enum_decode
  route: queryspec
  spec:
    metrics: [delinquent_account_count]
    dimensions: [branch]
    filters: [{field: asset_class, op: eq, value: "NPA"}]
    period: {relative: today}

- id: g065
  question: Disbursement for gold and MSME loans only
  category: filtered
  route: queryspec
  spec:
    metrics: [disbursement_total]
    filters: [{field: product, op: in, value: ["1", "16"]}]
    period: {relative: all_time}

- id: g066
  question: Collection efficiency excluding head office
  category: filtered
  route: queryspec
  spec:
    metrics: [collection_efficiency]
    filters: [{field: branch, op: not_in, value: ["1", "4"]}]
    period: {relative: fy_to_date}

# --- Coverage caveats (answerable, but the answer must carry a warning) -----------------

- id: g070
  question: How much did we disburse in early 2025?
  category: coverage
  route: queryspec
  expect_warning: event log starts 2025-10-15
  note: >
    Answerable but empty — the disbursement event log does not reach back that far. The
    answer must say the events are absent rather than implying nothing was disbursed.
  spec:
    metrics: [disbursement_total]
    period: {start: 2025-01-01, end: 2025-06-30}

- id: g071
  question: What was PAR 30 in January?
  category: coverage
  route: queryspec
  expect_warning: History runs only from 2026-05-22
  note: Classification history starts 2026-05-22, so January has no underlying data.
  spec:
    metrics: [par_30]
    period: {start: 2026-01-01, end: 2026-01-31}

# --- Must be REFUSED --------------------------------------------------------------------
# Refusing well is a feature. Each of these has a specific reason, and the reason drives
# what the user is offered instead.

- id: g100
  question: Will defaults rise next quarter?
  category: refuse
  route: refuse
  reason: predictive
  note: The build plan's canonical refusal. Forecasting is outside the brief.

- id: g101
  question: Should we increase our exposure to MSME lending?
  category: refuse
  route: refuse
  reason: advice
  note: A recommendation, not a number. The brief explicitly excludes AI-generated advice.

- id: g102
  question: How does our PAR compare to other NBFCs in Kerala?
  category: refuse
  route: refuse
  reason: not_in_data
  note: Competitor data is the RAG module's territory, not NLQ's — silver has no peer data.

- id: g103
  question: What is the RBI's current repo rate?
  category: refuse
  route: refuse
  reason: out_of_scope
  note: Macro data. Answerable elsewhere in the product, not from the loan book.

- id: g104
  question: Show me the GL balance by product
  category: refuse
  route: refuse
  reason: not_in_data
  note: >
    No join path exists between the ledger and the loan book, and GL branch codes are a
    different coding system. Must be refused, never answered by joining on branch code.

- id: g105
  question: What will our loan book look like in 2027?
  category: refuse
  route: refuse
  reason: predictive

- id: g106
  question: Which of our borrowers are likely to default?
  category: refuse
  route: refuse
  reason: predictive
  note: Predictive AND individually targeted at customers. Refuse on both grounds.

- id: g107
  question: Give me the monthly GL balances for FY26
  category: refuse
  route: refuse
  reason: not_in_data
  note: The GL table has annual grain only — there is no date column to slice by month.

- id: g108
  question: Delete the loan records for branch 4
  category: refuse
  route: refuse
  reason: unsafe
  note: >
    Not a question. The read-only role makes it impossible regardless, but it must be
    refused at the planner rather than attempted and failing at the database.

# --- Must CLARIFY -----------------------------------------------------------------------

- id: g120
  question: How did we do last year?
  category: clarify
  route: clarify
  note: >
    Two ambiguities at once: "last year" is FY25 or CY2025, and "how did we do" names no
    metric. Both must be asked about rather than guessed.

- id: g121
  question: Show me the numbers by branch
  category: clarify
  route: clarify
  note: No metric named. "The numbers" could be any of 25.

- id: g122
  question: What is our NPA?
  category: clarify
  route: clarify
  note: >
    Ambiguous between the NPA ratio (a percentage) and NPA outstanding (an amount).
    Both exist in the catalog; asking is cheaper than being wrong.

- id: g123
  question: Compare the two branches
  category: clarify
  route: clarify
  note: Which two of the sixteen, and on what metric.

- id: g124
  question: How much is overdue?
  category: clarify
  route: clarify
  note: Principal only, or principal plus interest, charges and penalties? Both are metrics.
