# Genesis NLQ — golden question set.
#
# Written BEFORE the planner exists (build plan item 14). Each entry is a question a real
# user would ask, paired with the route it must take and, where it is answerable, the
# QuerySpec it must produce. It is simultaneously the specification for the planner and the
# regression suite for it.
#
# Scoring is on EXECUTION MATCH, not string match: two specs are equivalent if they return
# the same result set. Many spellings of the same question are correct.
#
# The refusal and clarification cases matter as much as the answerable ones. A system that
# answers "will defaults rise next quarter?" with a confident number is worse than one that
# declines, and the negative cases are what train and hold that line.
#
# Categories: aggregate, breakdown, trend, ranking, ratio, point_in_time, comparison,
#             filtered, enum_decode, refuse, clarify, coverage
#
# Every 👎 from /nlq/feedback becomes a new case here — the set grows from real failures.

# --- Simple aggregates ------------------------------------------------------------------

- id: g001
  question: What was our total disbursement last quarter?
  category: aggregate
  route: queryspec
  spec:
    metrics: [disbursement_total]
    period: {relative: last_quarter}

- id: g002
  question: How many loans have we sanctioned in total?
  category: aggregate
  route: queryspec
  spec:
    metrics: [loan_count]
    period: {relative: all_time}

- id: g003
  question: What is the total sanctioned amount this financial year?
  category: aggregate
  route: queryspec
  spec:
    metrics: [sanctioned_amount]
    period: {relative: fy_to_date}

- id: g004
  question: How much did we collect last month?
  category: aggregate
  route: queryspec
  spec:
    metrics: [amount_collected]
    period: {relative: last_month}

- id: g005
  question: What is the average ticket size of our loans?
  category: ratio
  route: queryspec
  spec:
    metrics: [avg_ticket_size]
    period: {relative: all_time}

