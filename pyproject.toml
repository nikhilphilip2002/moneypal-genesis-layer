[project]
name = "moneypal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "genesis-core",
    "uvicorn[standard]>=0.49.0",
    "openpyxl>=3.1.0",
    "psycopg2-binary>=2.9.9",
    "pg8000>=1.31.2",
    # NLQ: SQLAlchemy Core builds the QuerySpec path's SQL (parameter binding by
    # construction); sqlglot parses the text-to-SQL path's output for the AST allowlist.
    "sqlalchemy>=2.0",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
]


[tool.uv.workspace]
members = [
    "packages/genesis_core",
    "oracle-import",
]

[tool.uv.sources]
genesis-core = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

