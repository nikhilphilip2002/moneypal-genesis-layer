[project]
name = "moneypal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "genesis-core",
    "uvicorn[standard]>=0.49.0",
    "openpyxl>=3.1.0",
    "psycopg2-binary>=2.9.9",
    "pg8000>=1.31.2",
    # NLQ: SQLAlchemy Core builds the QuerySpec path's SQL (parameter binding by
    # construction); sqlglot parses the text-to-SQL path's output for the AST allowlist.
    "sqlalchemy>=2.0",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
    "mcp==1.29.0",
    # Macro ingestion pipeline: bounded crawl of the public macro sources, plus the
    # weekly refresh worker. Embeddings/Qdrant/pypdf come via genesis-core.
    "requests>=2.32.0",
    "beautifulsoup4>=4.13.0",
    "lxml>=5.3.0",
    "APScheduler>=3.10,<4",
    # Hard-imported by app/services/workbench/graph.py; previously only ever installed
    # ad-hoc, so a clean `uv sync` produced a backend that could not start.
    "langgraph>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]


[tool.uv.workspace]
members = [
    "packages/genesis_core",
    "oracle-import",
]

[tool.uv.sources]
genesis-core = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
